services:
  - type: web
    name: mod-ai
    runtime: python
    region: oregon
    plan: starter
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_KEY
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
