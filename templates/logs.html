<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Sentinel OS - Audit Logs</title>
    <style>
        :root { --bg: #0f111a; --accent: #00ff00; --text: #e1e1e1; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px; }
        .log-entry { border-left: 4px solid var(--accent); background: #161925; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .time { font-size: 0.8rem; color: #a0aec0; }
    </style>
</head>
<body>
    <h2>Audit Logs</h2>
    <div class="log-entry">
        <div class="time">2026-02-15 18:20</div>
        <strong>SYSTEM:</strong> Sentinel OS v2.0 Booted Successfully.
    </div>
    <div class="log-entry">
        <div class="time">2026-02-15 18:15</div>
        <strong>MOD:</strong> Dashboard settings updated by Admin.
    </div>
</body>
</html>
