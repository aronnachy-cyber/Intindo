<div class="main">
    <h1>🛡️ Moderation Panel</h1>
    <div class="card">
        <form action="/update" method="POST">
            <label>Log Channel ID</label>
            <input type="text" name="log_channel" value="{{ config.log_channel }}">
            <label>Banned Words (Big Box)</label>
            <textarea name="banned_words" style="width: 100%; height: 150px; background: #0b0d13; color: #fff; border: 1px solid var(--accent); border-radius: 8px; padding: 10px;">{{ config.banned_words }}</textarea>
            <button type="submit" class="btn" style="margin-top: 15px;">UPDATE MODERATION</button>
        </form>
    </div>
</div>
