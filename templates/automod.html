<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Sentinel OS - Auto Mod</title>
    <style>
        :root { --bg: #0f111a; --card: #1c202f; --accent: #00ff00; --text: #e1e1e1; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #2d3748; width: 400px; }
        .status { color: var(--accent); font-weight: bold; }
        ul { list-style: none; padding: 0; }
        li::before { content: "• "; color: var(--accent); }
    </style>
</head>
<body>
    <h2>Auto-Moderation System</h2>
    <div class="card">
        <p>System Status: <span class="status">ACTIVE</span></p>
        <p><strong>Active Filters:</strong></p>
        <ul>
            <li>Anti-Spam Protection</li>
            <li>Banned Words Filter</li>
            <li>Link Protection</li>
        </ul>
        <p style="font-size: 0.8rem; color: #a0aec0;">Settings are synchronized with Main Dashboard.</p>
    </div>
</body>
</html>
