<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Sentinel OS - General</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f111a; --sidebar: #161925; --accent: #00ff00; --text: #e1e1e1; --card: #1c202f; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--sidebar); height: 100vh; padding: 20px; border-right: 1px solid #2d3748; position: fixed; }
        .nav-item { display: block; padding: 12px; color: #a0aec0; text-decoration: none; border-radius: 8px; margin-bottom: 10px; }
        .active { background: #2d3748; color: var(--accent); border-left: 4px solid var(--accent); }
        .main { margin-left: 280px; padding: 40px; flex: 1; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #2d3748; }
        input { width: 100%; padding: 12px; background: #0b0d13; border: 1px solid #2d3748; color: #fff; border-radius: 8px; margin: 10px 0; }
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--accent);">SENTINEL OS</h2>
        <a href="/" class="nav-item active"><i class="fas fa-home"></i> General</a>
        <a href="/moderation" class="nav-item"><i class="fas fa-shield-halved"></i> Moderation</a>
        <a href="/welcome" class="nav-item"><i class="fas fa-door-open"></i> Welcome</a>
    </div>
    <div class="main">
        <h1>🏠 General Settings</h1>
        <div class="card">
            <form action="/update" method="POST">
                <label>Bot Nickname</label><input type="text" name="nickname" value="{{ config.nickname }}">
                <label>Prefix</label><input type="text" name="prefix" value="{{ config.prefix }}">
                <button type="submit" class="btn">SAVE CHANGES</button>
            </form>
        </div>
    </div>
</body>
</html>
