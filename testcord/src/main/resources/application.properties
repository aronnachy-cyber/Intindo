server.port=5000
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:file:./testcord-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

testcord.jwt.secret=testcord-super-secret-key-for-jwt-signing-must-be-long-enough-256bits
testcord.jwt.expiration=86400000

logging.level.com.testcord=INFO
