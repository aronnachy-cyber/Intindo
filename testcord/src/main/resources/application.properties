server.port=${PORT:5000}
server.address=0.0.0.0

# ── Database ──────────────────────────────────────────────────────────────
# Set DB_TYPE=postgres to switch to PostgreSQL, otherwise uses embedded H2
spring.datasource.url=${DB_URL:jdbc:h2:file:./testcord-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── Security ──────────────────────────────────────────────────────────────
# REQUIRED IN PRODUCTION: set JWT_SECRET to a random 64-char string
testcord.jwt.secret=${JWT_SECRET:testcord-super-secret-key-for-jwt-signing-must-be-long-enough-256bits}
testcord.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ── App identity ──────────────────────────────────────────────────────────
testcord.app.name=${APP_NAME:Testcord}
testcord.app.url=${APP_URL:http://localhost:5000}

logging.level.com.testcord=INFO
